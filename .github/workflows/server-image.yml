# Сборка Docker-образа zvuk-server и публикация в GitHub Container Registry.
# Kubernetes потом забирает образ отсюда (imagePullSecrets, если пакет
# приватный). Запуск:
#   - пуш в main с изменениями в server/  → теги latest, main, sha-<короткий>
#   - пуш тега server-v*                  → тег 0.1.0 (версия без префикса)
#   - вручную из вкладки Actions
# Секреты не нужны — образ публикуется через GITHUB_TOKEN (packages: write).
name: server-image

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-image.yml"]
    tags: ["server-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Сборка и пуш zvuk-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/zvuk-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=match,pattern=server-v(.*),group=1

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
