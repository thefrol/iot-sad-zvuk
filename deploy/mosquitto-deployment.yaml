apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: iot-sad-zvuk
  labels:
    app: mosquitto
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      nodeSelector:
        kubernetes.io/hostname: s37bfed61.fastvps-server.com
      # The passwd file is generated by the init container from the
      # mosquitto-auth Secret (created imperatively, not in git) into a
      # shared emptyDir mounted at /mosquitto/auth.
      initContainers:
        - name: init-passwd
          image: docker.io/library/eclipse-mosquitto:2
          command:
            - sh
            - -c
            - |
              set -e
              mosquitto_passwd -b -c /mosquitto/auth/passwd "$DEVICE_USER" "$DEVICE_PASS"
              mosquitto_passwd -b /mosquitto/auth/passwd "$BACKEND_USER" "$BACKEND_PASS"
              # mosquitto_passwd создаёт файл root:root с правами 0600, а брокер
              # работает под пользователем mosquitto (uid/gid 1883) — иначе
              # он не сможет открыть passwd, а 0644 root:root он отклонит
              chown 1883:1883 /mosquitto/auth/passwd
              chmod 0640 /mosquitto/auth/passwd
          env:
            - name: DEVICE_USER
              valueFrom:
                secretKeyRef:
                  name: mosquitto-auth
                  key: DEVICE_USER
            - name: DEVICE_PASS
              valueFrom:
                secretKeyRef:
                  name: mosquitto-auth
                  key: DEVICE_PASS
            - name: BACKEND_USER
              valueFrom:
                secretKeyRef:
                  name: mosquitto-auth
                  key: BACKEND_USER
            - name: BACKEND_PASS
              valueFrom:
                secretKeyRef:
                  name: mosquitto-auth
                  key: BACKEND_PASS
          volumeMounts:
            - name: auth
              mountPath: /mosquitto/auth
      containers:
        - name: mosquitto
          image: docker.io/library/eclipse-mosquitto:2
          ports:
            - containerPort: 1883
              name: mqtt
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: auth
          emptyDir: {}
